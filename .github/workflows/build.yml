name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish win-x64
        shell: pwsh
        run: ./build.ps1 -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: GitLabMR-win-x64
          path: publish/GitLabMR-win-x64.zip

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish ${{ matrix.rid }}
        run: chmod +x build.sh && ./build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: GitLabMR-${{ matrix.rid }}
          path: publish/GitLabMR-${{ matrix.rid }}.zip

  release:
    # Push tag dạng v1.0.0 -> tạo GitHub Release kèm file zip cho Windows + macOS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
