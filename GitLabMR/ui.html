<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>GitLab MR</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e5ea; --line2:#eef0f3; --text:#1c2024; --muted:#68707d; --faint:#9aa1ac;
  --accent:#4f5bd5; --accent-h:#4350c4; --accent-soft:#eceefc; --accent-ink:#fff;
  --ok:#17804a; --ok-bg:#e5f5ec; --warn:#9a5b06; --warn-bg:#fcf1de; --err:#c1352b; --err-bg:#fcebea;
  --info:#2d5ccc; --info-bg:#e8eefb; --mute:#6b7280; --mute-bg:#f0f1f4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --pop:0 8px 28px rgba(16,24,40,.16);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16171b; --panel:#1e1f24; --line:#2d2f37; --line2:#25272d; --text:#e5e6ea; --muted:#979ca8; --faint:#6b707c;
  --accent:#7882ee; --accent-h:#8b94f3; --accent-soft:#272a46; --accent-ink:#fff;
  --ok:#4cc07e; --ok-bg:#1a3124; --warn:#e2a443; --warn-bg:#382c16; --err:#ef7067; --err-bg:#3b1f1f;
  --info:#82a3f4; --info-bg:#1e2840; --mute:#9399a5; --mute-bg:#272930;
  --shadow:none; --pop:0 10px 30px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
input,button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- controls */
.in{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 9px;outline:none;min-width:0;
  transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in::placeholder{color:var(--faint)}
.in::-webkit-calendar-picker-indicator{display:none!important}
textarea.in{height:54px;padding:6px 9px;resize:none}
.btn{height:30px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;color:var(--muted);
  display:inline-grid;place-items:center;flex:none}
.icon:hover:not(:disabled){background:var(--line2);color:var(--text)}
.icon.on{background:var(--accent-soft);color:var(--accent)}
.icon.spinning svg{animation:rot .8s linear infinite;color:var(--accent)}
.lh .icon{width:26px;height:26px;margin:-2px -4px -2px 0}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.chk{appearance:none;width:15px;height:15px;border:1.5px solid var(--faint);border-radius:4px;margin:0;flex:none;display:grid;place-items:center;
  background:var(--panel);cursor:pointer}
.chk:checked,.chk:indeterminate{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.chk:indeterminate::after{content:"";width:7px;height:2px;background:#fff;border-radius:1px}
.chk:disabled{opacity:.5;cursor:default}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;white-space:nowrap}
.switch input{display:none}
.switch .tr{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.tr{background:var(--accent)}
.switch input:checked+.tr::after{transform:translateX(13px)}
.opt{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 0}

/* ---------- top */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#6e78f5,#3e48c4);color:#fff;
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .logo svg{width:17px;height:17px;stroke-width:2.2}
.wstabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.wstabs::-webkit-scrollbar{display:none}
.wstab{height:28px;padding:0 9px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);font-weight:600;
  white-space:nowrap;display:flex;align-items:center;gap:6px;max-width:168px;flex:none;transition:background .12s,color .12s}
.wstab .t{overflow:hidden;text-overflow:ellipsis;font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;min-width:0}
.wstab .t i{font-style:normal;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-weight:400;color:var(--faint);margin-left:5px;font-size:11px}
.wstab:hover:not(:disabled){background:var(--line2);color:var(--text)}
.wstab.on{background:var(--panel);border-color:var(--line);color:var(--text);box-shadow:var(--shadow)}
.wstab .dot{width:6px;height:6px}
.wstab:disabled{cursor:default}
.top .icon{width:28px;height:28px}
.conn-chip{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:14px;flex:none;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);max-width:42%;font-size:12px}
.conn-chip .gear{width:13px;height:13px;color:var(--faint)}
.conn .ws-head{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.conn .ws-head .lbl{font-size:12px;font-weight:700}
.conn .ws-head .in{flex:1;max-width:320px;font-weight:600}
.conn .ws-head .btn{margin-left:auto}
.conn .cred{display:flex;gap:8px;min-width:0}
.conn .cred .in{flex:1;min-width:0}
.conn .cred #gUser{flex:0 1 180px}
.wstab .kind{font-style:normal;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:9.5px;font-weight:800;
  color:#fff;background:#3f8e5b;border-radius:4px;width:15px;height:15px;display:grid;place-items:center;flex:none}
.bar .seg button:disabled{opacity:.35;cursor:not-allowed}
.conn-chip:hover{border-color:var(--faint)}
.conn-chip b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.cache{background:var(--faint);box-shadow:0 0 0 2px var(--line2)} .dot.err{background:var(--err)} .dot.wait{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.conn{margin:10px 14px 0;padding:10px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.conn .src-head{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;font-size:12px}
.conn .src-head .hint{color:var(--faint);font-size:11.5px}
.conn textarea.src{grid-column:1/-1;height:74px;font:12px/1.6 "Cascadia Mono",Consolas,monospace;white-space:pre;overflow:auto}
.seg{display:flex;background:var(--line2);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{height:24px;border:0;background:none;border-radius:6px;padding:0 10px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:5px;transition:background .12s,color .12s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.seg button svg{width:12px;height:12px}
.seg .n{font-size:11px;color:var(--faint);font-weight:600}
.fav{width:22px;height:22px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--line);border-radius:5px;flex:none}
.row:hover .fav{color:var(--faint)}
.fav:hover{background:var(--line);color:#e0a106!important}
.fav.on{color:#e0a106}
.fav svg{width:15px;height:15px}
.fav.on svg{fill:currentColor}
.conn .mini{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}

/* ---------- branch bar */
.bar{margin:10px 14px 0;padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative}
.bar .seg button{padding:0 9px}
.bar .seg button.on{color:var(--accent)}
.arrow{color:var(--faint);display:grid;place-items:center;width:20px;flex:none}
.bar.branch .br .in{border-style:dashed}
.br{display:flex;align-items:center;flex:1;min-width:0;position:relative}
.br .tag{position:absolute;left:9px;font-size:11px;font-weight:600;color:var(--faint);pointer-events:none;text-transform:uppercase;letter-spacing:.03em}
.br .in{width:100%;padding-left:40px;font-weight:600;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}

.pop{position:absolute;right:8px;top:calc(100% + 6px);width:330px;padding:12px;z-index:20;box-shadow:var(--pop);
  display:flex;flex-direction:column;gap:8px}
.pop label.f{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.pop .hint{font-size:11px;color:var(--faint)}

/* ---------- list */
.list{margin:10px 14px 0;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:240px}
.search svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.search .in{width:100%;height:28px;padding-left:28px}
.count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.rows{flex:1;overflow-y:auto;padding:4px 0}
.rows::-webkit-scrollbar{width:10px} .rows::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid var(--panel)}
.row{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;cursor:pointer}
.row:hover{background:var(--line2)}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.name .ns{color:var(--faint);font-weight:400}
.st{display:inline-flex;align-items:center;gap:5px;max-width:52%;height:21px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.st span{overflow:hidden;text-overflow:ellipsis}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-done{background:var(--ok);color:#fff}
.st-warn{background:var(--warn-bg);color:var(--warn)} .st-err{background:var(--err-bg);color:var(--err)}
.st-info{background:var(--info-bg);color:var(--info)} .st-mute{background:var(--mute-bg);color:var(--mute)}
.mr{color:var(--muted);display:grid;place-items:center;width:22px;height:22px;border-radius:5px;flex:none}
.mr:hover{background:var(--line);color:var(--accent)}
.spin{width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{height:100%;display:grid;place-items:center;color:var(--faint);text-align:center;padding:30px}

/* ---------- footer */
.foot{display:flex;align-items:center;gap:10px;padding:10px 14px}
.sum{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;font-size:12px;color:var(--muted)}
.sum .st{max-width:none}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;font-weight:700}

.logp{position:fixed;left:14px;right:14px;bottom:54px;height:42%;z-index:15;display:flex;flex-direction:column;box-shadow:var(--pop)}
.logp .hd{display:flex;align-items:center;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);font-weight:600}
.logp .hd .icon{margin-left:auto;width:26px;height:26px}
.logp pre{flex:1;margin:0;padding:8px 12px;overflow:auto;font:11.5px/1.55 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-word;user-select:text}
.btn.sm{height:26px;padding:0 9px;font-size:12px;gap:5px}
.btn .cnt{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:10.5px;display:inline-grid;place-items:center}
.hint2{margin-left:8px;font-weight:400;color:var(--faint);font-size:12px}
.mrtext{flex:1;margin:0;border:0;outline:none;resize:none;background:none;padding:10px 12px;
  font:11.5px/1.6 "Cascadia Mono",Consolas,monospace;user-select:text;white-space:pre;overflow:auto}
.l-success{color:var(--ok)} .l-warn{color:var(--warn)} .l-error{color:var(--err)} .l-t{color:var(--faint)}

.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);max-width:80%;padding:8px 14px;border-radius:8px;z-index:40;
  background:var(--text);color:var(--bg);font-weight:600;box-shadow:var(--pop);font-size:12.5px}
.toast.err{background:var(--err);color:#fff}

.modal{position:fixed;inset:0;background:rgba(10,12,16,.35);display:grid;place-items:center;z-index:30}
.modal .card{width:min(400px,90vw);padding:18px;box-shadow:var(--pop)}
.modal h3{margin:0 0 4px;font-size:15px}
.modal .pair{font-family:"Cascadia Mono",Consolas,monospace;font-weight:600;color:var(--accent);margin-bottom:10px}
.modal ul{margin:0;padding:8px 10px 8px 26px;max-height:170px;overflow:auto;background:var(--line2);border-radius:7px;font-size:12px}
.modal .warn{margin-top:10px;color:var(--warn);font-size:12px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.br{min-width:110px}
.search{min-width:70px}
@media (max-width:660px){
  .count{display:none}
  .search{max-width:none}
  .conn{grid-template-columns:1fr auto}
  .conn .mini{grid-column:1}
  .conn .src-head .hint{display:none}
}
@media (max-width:520px){ .switch{font-size:0;gap:0} }
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="brand" title="GitLab MR"><span class="logo"><svg viewBox="0 0 24 24"><path d="M8.5 6.5v11M15.5 9.5c0 3-7 2.2-7 5.5"/><circle cx="8.5" cy="6.2" r="2.2"/><circle cx="8.5" cy="17.8" r="2.2"/><circle cx="15.5" cy="8.8" r="2.2"/></svg></span></div>
  <nav id="wsTabs" class="wstabs"></nav>
  <button id="wsAdd" class="icon" title="Thêm workspace (GitLab / token khác)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="chip" class="conn-chip" title="Cài đặt workspace này"><span id="dot" class="dot"></span><b id="chipText">Chưa kết nối</b><span id="chipUser"></span><svg viewBox="0 0 24 24" class="gear"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section id="conn" class="card conn">
  <div class="ws-head">
    <span class="lbl">Workspace</span>
    <div id="kindSeg" class="seg" title="Loại server">
      <button data-kind="gitlab">GitLab</button>
      <button data-kind="gerrit">Gerrit</button>
    </div>
    <input id="wsName" class="in" placeholder="Tên workspace (vd: peoplex, peoplex2024)" spellcheck="false">
    <button id="wsDel" class="btn sm danger" title="Xoá workspace này">Xoá</button>
  </div>
  <div class="src-head"><b id="srcTitle">Group / repo</b><span id="srcHint" class="hint"></span></div>
  <textarea id="url" class="in src" spellcheck="false"></textarea>
  <div class="cred">
    <input id="gUser" class="in" placeholder="Username Gerrit" spellcheck="false" hidden>
    <input id="token" class="in" type="password" placeholder="Access token (scope api)" spellcheck="false">
  </div>
  <label class="mini"><input id="ssl" type="checkbox" class="chk"> Bỏ qua SSL</label>
  <button id="btnConnect" class="btn primary">Kết nối</button>
</section>

<section class="card bar">
  <div id="modeSeg" class="seg" title="Chế độ: tạo/merge MR hoặc tạo branch hàng loạt">
    <button data-mode="mr">MR</button>
    <button data-mode="branch">Branch</button>
  </div>
  <div class="br"><span id="tagA" class="tag">Từ</span><input id="source" class="in" list="brList" placeholder="pre-uat" spellcheck="false"></div>
  <button id="swap" class="icon" title="Đảo nguồn / đích"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
  <span id="arrow" class="arrow" hidden><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  <div class="br"><span id="tagB" class="tag">Vào</span><input id="target" class="in" list="brList" placeholder="uat" spellcheck="false"></div>
  <datalist id="brList"></datalist>
  <button id="btnBranches" class="icon" title="Tải lại branch từ GitLab (của các project đang chọn)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9M3 4v5h5M4 13a8 8 0 0 0 14.7 4.3L21 15M21 20v-5h-5"/></svg></button>
  <span id="sepMr" class="sep"></span>
  <label id="mergeSw" class="switch" title="Tạo xong merge luôn"><input id="merge" type="checkbox"><span class="tr"></span>Merge</label>
  <button id="btnOpts" class="icon" title="Tuỳ chọn khác"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>

  <div id="pop" class="card pop" hidden>
    <label class="opt"><input id="autoMerge" type="checkbox" class="chk">Pipeline đang chạy → tự merge khi pass</label>
    <label class="opt"><input id="removeSource" type="checkbox" class="chk">Xoá branch nguồn sau khi merge</label>
    <label class="opt"><input id="squash" type="checkbox" class="chk">Squash commits</label>
    <label class="f">Tiêu đề MR</label>
    <input id="title" class="in" spellcheck="false">
    <span class="hint">Biến: {source} {target} {project}</span>
    <label class="f">Mô tả</label>
    <textarea id="desc" class="in"></textarea>
  </div>
</section>

<main class="card list">
  <div class="lh">
    <input id="all" type="checkbox" class="chk" title="Chọn / bỏ chọn các dòng đang hiển thị">
    <div id="tabs" class="seg">
      <button data-tab="fav"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Favorite <span id="nFav" class="n"></span></button>
      <button data-tab="all">All <span id="nAll" class="n"></span></button>
    </div>    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="filter" class="in" placeholder="Lọc project…" spellcheck="false"></div>
    <button id="pickReady" class="link" hidden>Chỉ chọn project sẵn sàng</button>
    <span id="count" class="count"></span>
    <button id="btnAdd" class="icon" title="Thêm group / repo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="btnReload" class="icon" title="Tải lại danh sách project"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9M3 4v5h5M4 13a8 8 0 0 0 14.7 4.3L21 15M21 20v-5h-5"/></svg></button>
  </div>
  <div id="rows" class="rows"><div class="empty">Nhập URL group và token rồi bấm <b>&nbsp;Kết nối</b></div></div>
</main>

<footer class="foot">
  <button id="btnLog" class="icon" title="Nhật ký"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg></button>
  <span id="logBadge" class="badge" hidden></span>
  <button id="btnMr" class="btn sm" title="Xem / copy link kết quả (MR, branch)" hidden><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Link <span id="nMr" class="cnt"></span></button>
  <div id="sum" class="sum"></div>
  <button id="btnStop" class="btn danger" hidden>Dừng</button>
  <button id="btnCheck" class="btn">Kiểm tra</button>
  <button id="btnRun" class="btn primary">Tạo MR</button>
</footer>

<div id="logp" class="card logp" hidden>
  <div class="hd">Nhật ký<button id="logClear" class="icon" title="Xoá"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button><button id="logClose" class="icon" title="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <pre id="log"></pre>
</div>

<div id="mrp" class="card logp" hidden>
  <div class="hd">Link kết quả <span id="mrHint" class="hint2"></span>
    <button id="mrCopy" class="btn sm primary" style="margin-left:auto"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy tất cả</button>
    <button id="mrClose" class="icon" style="margin-left:4px" title="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <textarea id="mrText" class="mrtext" readonly spellcheck="false"></textarea>
</div>

<div id="modal" class="modal" hidden>
  <div class="card">
    <h3 id="mTitle"></h3>
    <div id="mPair" class="pair"></div>
    <ul id="mList"></ul>
    <div id="mWarn" class="warn" hidden>Branch nguồn sẽ bị xoá sau khi merge.</div>
    <div class="act"><button id="mNo" class="btn">Huỷ</button><button id="mYes" class="btn primary">Xác nhận</button></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
// Photino: window.external.sendMessage / receiveMessage (Windows WebView2 + macOS WKWebView)
const send = (type, d = {}) => window.external?.sendMessage?.(JSON.stringify({ type, ...d }));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COPY = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>';
const EXT = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

const S = { projects: [], sel: new Set(), st: {}, wsList: [], wsActive: null, wsHasToken: false, stCache: {}, fresh: false, busy: false, connected: false, errs: 0, remote: [], remoteTotal: 0, history: [], hidden: 0, tab: 'all' };
const STAR = '<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const inTab = p => S.tab === 'all' || p.fav;
const tabProjects = () => S.projects.filter(inTab);
const chosen = () => S.projects.filter(p => inTab(p) && S.sel.has(p.id));

const CLS = { Ready: 'ok', Created: 'ok', AutoMerge: 'ok', Merged: 'done', NoChanges: 'mute', AlreadyOpen: 'info', MissingBranch: 'warn', NotMerged: 'warn', BranchCreated: 'done', BranchExists: 'mute', Failed: 'err' };
const LABEL = { Ready: 'Sẵn sàng', Created: 'Đã tạo', AutoMerge: 'Auto-merge', Merged: 'Đã merge', NoChanges: 'Không đổi', AlreadyOpen: 'MR có sẵn', MissingBranch: 'Thiếu branch', NotMerged: 'Chưa merge', BranchCreated: 'Đã tạo branch', BranchExists: 'Đã có branch', Failed: 'Lỗi' };
// 2 chế độ dùng chung 2 ô nhập: MR (Từ → Vào) và Branch (Từ branch gốc → Tên branch mới)
const MODES = {
  mr: { tagA: 'Từ', tagB: 'Vào', phA: 'pre-uat', phB: 'uat' },
  branch: { tagA: 'Từ', tagB: 'Tên', phA: 'prod', phB: 'feature/jwt' },
};
S.mode = 'mr';
S.kind = 'gitlab';
S.vals ={ mr: { a: '', b: '' }, branch: { a: '', b: '' } };
function syncVals() { S.vals[S.mode] = { a: $('#source').value.trim(), b: $('#target').value.trim() }; }
function applyMode() {
  const M = MODES[S.mode], br = S.mode === 'branch';
  $('#tagA').textContent = M.tagA; $('#tagB').textContent = M.tagB;
  $('#source').placeholder = M.phA; $('#target').placeholder = M.phB;
  $('#source').value = S.vals[S.mode].a; $('#target').value = S.vals[S.mode].b;
  $('#source').title = br ? 'Branch gốc để tách ra (vd: prod)' : 'Branch nguồn của MR';
  $('#target').title = br ? 'Tên branch mới sẽ tạo trên mọi repo đã tick' : 'Branch đích của MR';
  for (const id of ['#swap', '#sepMr', '#mergeSw', '#btnOpts']) $(id).hidden = br;
  $('#arrow').hidden = !br;
  document.querySelector('.bar').classList.toggle('branch', br);
  document.querySelectorAll('#modeSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === S.mode);
    if (b.dataset.mode === 'mr') {
      b.disabled = S.busy || S.kind === 'gerrit';
      b.title = S.kind === 'gerrit' ? 'Gerrit: chỉ hỗ trợ tạo branch' : 'Tạo / merge Merge Request';
    }
  });
  if (br) { $('#pop').hidden = true; $('#btnOpts').classList.remove('on'); }
  runLabel();
}
function setMode(m) {
  if (m === 'mr' && S.kind === 'gerrit') return toast('Gerrit chỉ hỗ trợ tạo branch', true);
  if (m === S.mode) return;
  syncVals(); S.mode = m; applyMode();
  $('#sum').innerHTML = ''; $('#pickReady').hidden = true;
  saveOpts();
}

/* ---------- helpers */
function hostOf(u) {
  u = (u || '').split('\n').map(x => x.trim()).find(x => x && !x.startsWith('#')) || '';
  if (/^git@/i.test(u)) return u.slice(4).split(':')[0].toLowerCase();
  try { return new URL(u).host.toLowerCase(); } catch { return ''; }
}
function tokenHint() {
  const g = S.kind === 'gerrit';
  $('#token').placeholder = S.wsHasToken ? (g ? 'Đã lưu HTTP password — để trống để dùng lại' : 'Đã lưu token — để trống để dùng lại')
    : (g ? 'HTTP password (Gerrit → Settings → HTTP Credentials)' : 'Access token của GitLab này (scope api)');
}
/* Loại workspace: GitLab (MR + branch) hoặc Gerrit (chỉ tạo branch) */
const KINDS = {
  gitlab: {
    title: 'Group / repo',
    hint: 'Mỗi dòng 1 link — group thì lấy hết project bên trong, repo thì thêm đúng repo đó. Ctrl+Enter để kết nối.',
    ph: 'https://gitlab.company.com/my-group\nhttps://gitlab.company.com/other-group/some-repo',
  },
  gerrit: {
    title: 'Project Gerrit',
    hint: 'Mỗi dòng 1 link — kết thúc bằng / là lấy mọi project bên dưới, còn lại là đúng project đó (dán link clone cũng được). Chỉ hỗ trợ tạo branch.',
    ph: 'https://review.company.com/peoplex/api/\nhttps://review.company.com/a/peoplex/api/core-pr',
  },
};
function applyKind() {
  const K = KINDS[S.kind], g = S.kind === 'gerrit';
  $('#srcTitle').textContent = K.title; $('#srcHint').textContent = K.hint; $('#url').placeholder = K.ph;
  $('#gUser').hidden = !g;
  document.querySelectorAll('#kindSeg button').forEach(b => b.classList.toggle('on', b.dataset.kind === S.kind));
  if (g && S.mode !== 'branch') { syncVals(); S.mode = 'branch'; }
  tokenHint(); applyMode();
}
function renderWsTabs() {
  // Đếm host trùng: chỉ khi 2 workspace cùng host mới hiện thêm tên để phân biệt -> tab gọn
  const hostCount = {};
  for (const w of S.wsList) if (w.shortHost) hostCount[w.shortHost] = (hostCount[w.shortHost] || 0) + 1;
  $('#wsTabs').innerHTML = S.wsList.map(w => {
    const main = w.shortHost || w.name;
    const sub = w.shortHost && hostCount[w.shortHost] > 1 && w.name ? `<i>${esc(w.name)}</i>` : '';
    const kind = w.kind === 'gerrit' ? '<em class="kind" title="Gerrit">G</em>' : '';
    const tip = [w.kind === 'gerrit' ? 'Gerrit' : 'GitLab', w.host, w.name].filter(Boolean).join(' · ') +
      (w.id === S.wsActive ? ' — bấm lần nữa để mở cài đặt' : '');
    return `<button class="wstab${w.id === S.wsActive ? ' on' : ''}" data-ws="${esc(w.id)}" title="${esc(tip)}" ${S.busy ? 'disabled' : ''}>` +
      `<span class="dot${w.connected ? ' ok' : ''}"></span>${kind}<span class="t">${esc(main)}${sub}</span></button>`;
  }).join('');
}
function fillList(id, items) { $(id).innerHTML = (items || []).map(x => `<option value="${esc(x)}">`).join(''); }
function fillBranches() {
  const seen = new Set(), html = [];
  for (const b of S.remote) { seen.add(b.name); html.push(`<option value="${esc(b.name)}" label="${b.count}/${S.remoteTotal} project">`); }
  for (const b of S.history) if (!seen.has(b)) html.push(`<option value="${esc(b)}" label="đã dùng">`);
  $('#brList').innerHTML = html.join('');
}
let toastTimer;
function toast(text, err) {
  const t = $('#toast'); t.textContent = text; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 5000 : 2500);
}
function ago(iso) {
  const t = Date.parse(iso || ''); if (!t) return '';
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  return m < 1 ? 'vừa xong' : m < 60 ? `${m} phút trước` : m < 1440 ? `${Math.round(m / 60)} giờ trước` : `${Math.round(m / 1440)} ngày trước`;
}
function fmtTime(iso) {
  const t = new Date(iso || ''); if (isNaN(t)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(t.getHours())}:${p(t.getMinutes())} ${p(t.getDate())}/${p(t.getMonth() + 1)}`;
}
function chip(text, dot, user = '') {
  $('#chipText').textContent = text; $('#dot').className = 'dot ' + dot; $('#chipUser').textContent = user;
}
function opts() {
  syncVals();
  return {
    mode: S.mode,
    source: S.vals.mr.a, target: S.vals.mr.b,          // MR: nguồn → đích
    base: S.vals.branch.a, name: S.vals.branch.b,       // Branch: gốc → tên mới
    title: $('#title').value.trim(), description: $('#desc').value,
    merge: $('#merge').checked, autoMerge: $('#autoMerge').checked, removeSource: $('#removeSource').checked, squash: $('#squash').checked,
    ignoreSsl: $('#ssl').checked,
  };
}
let optTimer;
function saveOpts() { clearTimeout(optTimer); optTimer = setTimeout(() => send('options', opts()), 300); }
let selTimer;
function saveSel() {
  clearTimeout(selTimer);
  selTimer = setTimeout(flushSel, 300);
}
function flushSel() {
  clearTimeout(selTimer);
  if (S.connected) send('selection', { paths: S.projects.filter(p => S.sel.has(p.id)).map(p => p.path) });
}
function runLabel() {
  const n = chosen().length;
  const label = S.mode === 'branch' ? 'Tạo branch' : $('#merge').checked ? 'Tạo & merge' : 'Tạo MR';
  $('#btnRun').textContent = label + (n ? ` (${n})` : '');
  $('#autoMerge').disabled = !$('#merge').checked;
}

/* ---------- list */
function visible() {
  const f = $('#filter').value.trim().toLowerCase(), list = tabProjects();
  return f ? list.filter(p => p.path.toLowerCase().includes(f)) : list;
}
function renderTabs() {
  const favs = S.projects.filter(p => p.fav);
  const lbl = (list) => { const n = list.filter(p => S.sel.has(p.id)).length; return n ? `${n}/${list.length}` : `${list.length}`; };
  $('#nFav').textContent = lbl(favs); $('#nAll').textContent = lbl(S.projects);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
}
function rowHtml(p) {
  const s = S.st[p.id], on = S.sel.has(p.id);
  let badge = '';
  if (s) badge = `<span class="st st-${s.cls}" title="${esc(s.text)}">${s.spin ? '<i class="spin"></i>' : ''}<span>${esc(s.text)}</span></span>`;
  const link = s?.url ? `<a class="mr" href="#" data-copy="${esc(s.url)}" title="Copy link MR">${COPY}</a><a class="mr" href="#" data-url="${esc(s.url)}" title="Mở MR">${EXT}</a>` : '';
  return `<label class="row" data-id="${p.id}" title="${esc(p.path)}${p.defaultBranch ? ' · default: ' + esc(p.defaultBranch) : ''}">` +
    `<input type="checkbox" class="chk" ${on ? 'checked' : ''} ${S.busy ? 'disabled' : ''}>` +
    `<button class="fav${p.fav ? ' on' : ''}" data-fav="1" title="${p.fav ? 'Bỏ khỏi Favorite' : 'Thêm vào Favorite'}">${STAR}</button>` +
    `<span class="name"><span class="ns">${esc(p.ns)}</span>${esc(p.name)}</span>${badge}${link}</label>`;
}
function render() {
  const v = visible();
  $('#rows').innerHTML = S.projects.length
    ? (v.length ? v.map(rowHtml).join('')
      : S.tab === 'fav' && !$('#filter').value.trim()
        ? '<div class="empty">Chưa có repo yêu thích.<br>Sang tab <b>&nbsp;All&nbsp;</b> bấm ☆ ở repo hay dùng để thêm vào đây.</div>'
        : '<div class="empty">Không có project nào khớp bộ lọc</div>')
    : `<div class="empty">${S.connected ? 'Không có project nào' : 'Nhập URL group và token rồi bấm <b>&nbsp;Kết nối</b>'}</div>`;
  counts();
}
function counts() {
  const v = visible(), n = v.filter(p => S.sel.has(p.id)).length;
  const all = $('#all');
  all.checked = v.length > 0 && n === v.length; all.indeterminate = n > 0 && n < v.length; all.disabled = S.busy || !v.length;
  $('#count').textContent = S.projects.length ? `${chosen().length}/${tabProjects().length} đã chọn` : '';
  renderTabs();
  $('#count').title = S.hidden ? `Đang ẩn ${S.hidden} project (libraries + shared) theo cấu hình` : '';
  runLabel();
}
/* ---------- MR links */
function mrItems() { return S.projects.filter(p => S.st[p.id]?.url); }
function mrText() {
  const items = mrItems();
  if (!items.length) return '';
  const head = S.pair ? `MR ${S.pair}\n` : '';
  return head + items.map(p => `- ${p.ns}${p.name} (${LABEL[S.st[p.id].outcome] || ''}): ${S.st[p.id].url}`).join('\n');
}
function updateMr() {
  const n = mrItems().length;
  $('#btnMr').hidden = n === 0; $('#nMr').textContent = n;
  $('#mrHint').textContent = n ? `${n} link` : '';
  if (!$('#mrp').hidden) $('#mrText').value = mrText();
}
function copyText(text, what) { if (!text) return; send('copy', { text }); toast(`Đã copy ${what}`); }
function showPanel(id) {
  for (const x of ['#logp', '#mrp']) if (x !== id) $(x).hidden = true;
  const p = $(id); p.hidden = !p.hidden;
  $('#btnLog').classList.toggle('on', !$('#logp').hidden);
  return !p.hidden;
}

function updateRow(id) {
  const el = document.querySelector(`.row[data-id="${id}"]`);
  const p = S.projects.find(x => x.id === id);
  if (el && p) el.outerHTML = rowHtml(p);
}

/* ---------- actions */
function connect() {
  if (S.busy) return;
  const urls = $('#url').value.trim();
  if (!urls) { $('#conn').hidden = false; return toast('Nhập ít nhất 1 link group hoặc repo', true); }
  chip('Đang kết nối…', 'wait');
  S.fresh = true;
  send('connect', { kind: S.kind, name: $('#wsName').value.trim(), user: $('#gUser').value.trim(), urls,
    token: $('#token').value.trim(), ignoreSsl: $('#ssl').checked });
}
function run(dryRun) {
  if (S.busy) return;
  if (!S.connected) return toast('Kết nối trước đã', true);
  const o = opts(), br = o.mode === 'branch';
  const a = br ? o.base : o.source, b = br ? o.name : o.target;
  if (!a || !b) return toast(br ? 'Nhập branch gốc (Từ) và tên branch mới (Tên)' : 'Nhập branch nguồn và đích', true);
  if (a === b) return toast(br ? 'Branch mới phải khác branch gốc' : 'Branch nguồn và đích phải khác nhau', true);
  if (br && /\s/.test(b)) return toast('Tên branch không được có khoảng trắng', true);
  const list = chosen();
  if (!list.length) return toast('Chưa chọn project nào', true);
  const payload = { ...o, dryRun, ids: list.map(p => p.id) };
  S.pair = br ? `branch ${b} (từ ${a})` : `${a} → ${b}`;
  $('#pop').hidden = true; $('#btnOpts').classList.remove('on');
  if (dryRun) return send('run', payload);
  $('#mTitle').textContent = br ? `Tạo branch cho ${list.length} project?`
    : `${o.merge ? 'Tạo MR và merge' : 'Tạo MR'} cho ${list.length} project?`;
  $('#mPair').textContent = br ? `${b}   (tách từ ${a})` : `${a}  →  ${b}`;
  $('#mList').innerHTML = list.map(p => `<li>${esc(p.ns + p.name)}</li>`).join('');
  $('#mWarn').hidden = br || !(o.merge && o.removeSource);
  $('#mYes').textContent = br ? 'Tạo branch' : o.merge ? 'Tạo & merge' : 'Tạo MR';
  $('#modal').hidden = false; $('#mYes').focus();
  $('#mYes').onclick = () => { $('#modal').hidden = true; send('run', payload); };
}
function setBusy(b) {
  S.busy = b;
  for (const id of ['#btnConnect', '#btnCheck', '#btnRun', '#url', '#token', '#source', '#target', '#swap', '#btnBranches', '#btnReload', '#btnAdd', '#wsAdd', '#wsDel', '#wsName']) $(id).disabled = b;
  document.querySelectorAll('#modeSeg button, #kindSeg button').forEach(x => x.disabled = b || (x.dataset.mode === 'mr' && S.kind === 'gerrit'));
  $('#gUser').disabled = b;
  renderWsTabs();
  $('#btnStop').hidden = !b;
  document.querySelectorAll('.row .chk').forEach(c => c.disabled = b);
  counts();
}
function showSummary(counts, dryRun) {
  const order = ['Merged', 'Created', 'AutoMerge', 'BranchCreated', 'Ready', 'AlreadyOpen', 'BranchExists', 'NotMerged', 'MissingBranch', 'NoChanges', 'Failed'];
  $('#sum').innerHTML = order.filter(k => counts[k]).map(k => `<span class="st st-${CLS[k]}">${counts[k]} ${LABEL[k]}</span>`).join('');
  $('#pickReady').hidden = !(dryRun && counts.Ready);
}

/* ---------- messages from C# */
const H = {
  init(d) {
    S.history = d.branches || [];
    fillBranches();
    $('#title').value = d.title || ''; $('#merge').checked = !!d.merge; $('#autoMerge').checked = !!d.autoMerge;
    $('#removeSource').checked = !!d.removeSource; $('#squash').checked = !!d.squash;
    applyKind();
  },
  wsList(d) { S.wsList = d.items || []; S.wsActive = d.active; renderWsTabs(); },
  wsInfo(d) {
    // Chuyển sang workspace khác: nạp cấu hình của nó, xoá danh sách đang hiện
    S.wsActive = d.id; S.wsHasToken = !!d.hasToken;
    S.connected = false; S.projects = []; S.sel = new Set(); S.st = {}; S.remote = []; S.remoteTotal = 0; S.hidden = 0;
    $('#wsName').value = d.name || ''; $('#url').value = (d.sources || []).join('\n'); $('#ssl').checked = !!d.ignoreSsl;
    $('#token').value = ''; tokenHint();
    S.vals = { mr: { a: d.source || '', b: d.target || '' }, branch: { a: d.branchBase || '', b: d.branchName || '' } };
    S.mode = d.mode === 'branch' ? 'branch' : 'mr';
    S.kind = d.kind === 'gerrit' ? 'gerrit' : 'gitlab';
    $('#gUser').value = d.username || '';
    applyKind();
    $('#sum').innerHTML = ''; $('#pickReady').hidden = true; $('#filter').value = '';
    const ready = S.wsHasToken && (d.sources || []).length > 0;
    chip(ready ? 'Đang tải…' : 'Chưa cấu hình', ready ? 'wait' : '');
    $('#conn').hidden = ready;
    if (!ready) setTimeout(() => ($('#url').value ? $('#token') : $('#url')).focus(), 50);
    fillBranches(); renderWsTabs(); render(); updateMr();
  },
  connected(d) {
    if (d.wsId !== S.wsActive) return;
    S.connected = true; S.wsHasToken = true; S.projects = d.projects; S.hidden = d.hidden || 0;
    S.st = S.fresh || !S.stCache[d.wsId] ? (S.stCache[d.wsId] = {}) : S.stCache[d.wsId];
    S.fresh = false;
    S.sel = new Set(d.projects.filter(p => p.selected).map(p => p.id));
    $('#token').value = ''; tokenHint();
    S.tab = d.projects.some(p => p.fav) ? 'fav' : 'all';
    // Danh sách từ cache: chấm xám + tuổi cache; vừa tải từ server: chấm xanh
    const age = ago(d.loadedAt);
    chip(`${d.projects.length} project`, d.fromCache ? 'cache' : 'ok', '@' + d.user + (d.fromCache && age ? ` · ${age}` : ''));
    $('#chip').title = `${d.host} — ${d.fromCache ? `danh sách từ cache (tải lúc ${fmtTime(d.loadedAt)}), bấm ⟳ ở góc danh sách để tải lại` : 'vừa tải từ server'}. Bấm để cài đặt workspace.`;
    $('#conn').hidden = true; $('#filter').value = '';
    render(); updateMr();
  },
  busy(d) { setBusy(d.value); if (!d.value) $('#btnBranches').classList.remove('spinning'); },
  branches(d) { S.history = d.branches || []; fillBranches(); },
  branchesLoading() { $('#btnBranches').classList.add('spinning'); },
  remoteBranches(d) {
    S.remote = d.items || []; S.remoteTotal = d.total || 0; fillBranches();
    const b = $('#btnBranches');
    b.title = `Tải lại branch gợi ý (của các repo đang tick) — lần tải trước: ${ago(d.at) || '?'}, ${S.remote.length} branch / ${S.remoteTotal} project`;
    if (b.classList.contains('spinning')) toast(`Đã tải ${S.remote.length} branch từ ${S.remoteTotal} project`);
    b.classList.remove('spinning');
  },
  row(d) {
    S.st[d.id] = d.state === 'wait' ? { cls: 'mute', text: 'Chờ…' }
      : d.state === 'run' ? { cls: 'info', text: 'Đang xử lý', spin: true }
      : { cls: CLS[d.outcome] || 'mute', text: d.text, url: d.url, outcome: d.outcome };
    updateRow(d.id);
    if (d.state === 'done') updateMr();
  },
  done(d) { showSummary(d.counts || {}, d.dryRun); },
  log(d) {
    const pre = $('#log'), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
    pre.insertAdjacentHTML('beforeend', `<span class="l-t">${esc(d.time)}</span> <span class="l-${d.kind}">${esc(d.text)}</span>\n`);
    if (atEnd) pre.scrollTop = pre.scrollHeight;
    if (d.kind === 'error' && $('#logp').hidden) { S.errs++; $('#logBadge').textContent = S.errs; $('#logBadge').hidden = false; }
  },
  error(d) {
    toast(d.text, true);
    if (!S.connected) { chip('Lỗi kết nối', 'err'); $('#conn').hidden = false; }
  },
};
window.external?.receiveMessage?.(raw => { let d; try { d = JSON.parse(raw); } catch { return; } H[d?.type]?.(d); });

/* ---------- UI events */
$('#chip').onclick = () => { $('#conn').hidden = !$('#conn').hidden; if (!$('#conn').hidden) $('#url').focus(); };
$('#btnConnect').onclick = connect;
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { if (!S.busy) setMode(b.dataset.mode); });
document.querySelectorAll('#kindSeg button').forEach(b => b.onclick = () => {
  if (S.busy || S.kind === b.dataset.kind) return;
  S.kind = b.dataset.kind; S.wsHasToken = false; // đổi loại server thì phải nhập lại token / password
  applyKind();
  // Gợi ý username Gerrit từ link clone dạng https://user@host/...
  if (S.kind === 'gerrit' && !$('#gUser').value) {
    const m = $('#url').value.match(/https?:\/\/([^@\/\s:]+)@/); if (m) $('#gUser').value = m[1];
  }
  toast(S.kind === 'gerrit' ? 'Gerrit: nhập username + HTTP password, chỉ hỗ trợ tạo branch' : 'GitLab: nhập access token (scope api)');
});
$('#wsTabs').addEventListener('click', e => {
  const b = e.target.closest('.wstab'); if (!b || S.busy) return;
  if (b.dataset.ws === S.wsActive) { $('#conn').hidden = !$('#conn').hidden; return; }
  flushSel();
  send('switch', { id: b.dataset.ws });
});
$('#wsAdd').onclick = () => { if (!S.busy) send('addWs'); };
let delTimer;
$('#wsDel').onclick = () => {
  const b = $('#wsDel');
  if (b.dataset.armed) { clearTimeout(delTimer); delete b.dataset.armed; b.textContent = 'Xoá'; send('deleteWs', { id: S.wsActive }); return; }
  b.dataset.armed = '1'; b.textContent = 'Bấm lần nữa để xoá';
  delTimer = setTimeout(() => { delete b.dataset.armed; b.textContent = 'Xoá'; }, 3000);
};
$('#token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); connect(); } });
$('#btnAdd').onclick = () => {
  $('#conn').hidden = false;
  const t = $('#url'); if (t.value && !t.value.endsWith('\n')) t.value += '\n';
  t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  toast('Dán link group / repo vào dòng mới rồi bấm Kết nối');
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  if (S.tab === b.dataset.tab) return;
  S.tab = b.dataset.tab; $('#filter').value = ''; $('#pickReady').hidden = true; render();
});
$('#url').addEventListener('input', tokenHint);
$('#ssl').onchange = saveOpts;
$('#swap').onclick = () => { const s = $('#source').value; $('#source').value = $('#target').value; $('#target').value = s; saveOpts(); };
for (const id of ['#source', '#target', '#title', '#desc']) $(id).addEventListener('input', saveOpts);
for (const id of ['#merge', '#autoMerge', '#removeSource', '#squash']) $(id).addEventListener('change', () => { runLabel(); saveOpts(); });
$('#btnOpts').onclick = e => { e.stopPropagation(); const p = $('#pop'); p.hidden = !p.hidden; $('#btnOpts').classList.toggle('on', !p.hidden); };
document.addEventListener('click', e => {
  if (!$('#pop').hidden && !e.target.closest('#pop') && !e.target.closest('#btnOpts')) { $('#pop').hidden = true; $('#btnOpts').classList.remove('on'); }
});

$('#filter').addEventListener('input', render);
$('#all').onchange = e => { for (const p of visible()) e.target.checked ? S.sel.add(p.id) : S.sel.delete(p.id); render(); saveSel(); };
$('#rows').addEventListener('change', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = +row.dataset.id; e.target.checked ? S.sel.add(id) : S.sel.delete(id); counts(); saveSel();
});
$('#rows').addEventListener('click', e => {
  const f = e.target.closest('.fav');
  if (f) {
    e.preventDefault(); e.stopPropagation();
    const p = S.projects.find(x => x.id === +f.closest('.row').dataset.id); if (!p) return;
    // ★ chỉ đổi favorite, KHÔNG đụng tới checkbox chọn repo
    p.fav = !p.fav; send('favorite', { path: p.path, on: p.fav });
    if (S.tab === 'fav' && !p.fav) render(); else { updateRow(p.id); counts(); }
    toast(p.fav ? `★ Đã thêm ${p.name} vào Favorite` : `Đã bỏ ${p.name} khỏi Favorite`);
    return;
  }
  const a = e.target.closest('.mr'); if (!a) return;
  e.preventDefault(); e.stopPropagation();
  if (a.dataset.copy) copyText(a.dataset.copy, 'link MR'); else send('open', { url: a.dataset.url });
});
$('#pickReady').onclick = () => {
  for (const p of tabProjects()) S.st[p.id]?.outcome === 'Ready' ? S.sel.add(p.id) : S.sel.delete(p.id);
  render(); saveSel(); toast(`Đã chọn ${chosen().length} project sẵn sàng`);
};

$('#btnBranches').onclick = () => {
  if (S.busy) return;
  if (!S.connected) return toast('Kết nối trước đã', true);
  const ids = chosen().map(p => p.id);
  send('loadBranches', { ids: ids.length ? ids : tabProjects().map(p => p.id) });
};
$('#btnReload').onclick = () => { if (!S.busy) connect(); };
$('#btnCheck').onclick = () => run(true);
$('#btnRun').onclick = () => run(false);
$('#btnStop').onclick = () => send('stop');
$('#mNo').onclick = () => $('#modal').hidden = true;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#modal').hidden = true; $('#pop').hidden = true; $('#logp').hidden = true; $('#mrp').hidden = true; } });

$('#btnLog').onclick = () => {
  if (showPanel('#logp')) { S.errs = 0; $('#logBadge').hidden = true; $('#log').scrollTop = $('#log').scrollHeight; }
};
$('#logClose').onclick = () => { $('#logp').hidden = true; $('#btnLog').classList.remove('on'); };
$('#btnMr').onclick = () => { if (showPanel('#mrp')) $('#mrText').value = mrText(); };
$('#mrClose').onclick = () => $('#mrp').hidden = true;
$('#mrCopy').onclick = () => copyText(mrText(), `${mrItems().length} link MR`);
$('#logClear').onclick = () => $('#log').innerHTML = '';
document.addEventListener('contextmenu', e => { if (!e.target.closest('input,textarea,pre')) e.preventDefault(); });

send('ready');
</script>
</body>
</html>
